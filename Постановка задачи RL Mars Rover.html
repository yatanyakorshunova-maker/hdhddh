document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e;font-size:32px;color:#4A4A46;\">МИР {{ worldName }} · ЗАЕЗД {{ attempt }}<\u002Fspan>\n      <\u002Fdiv>\n      <canvas class=\"cv\" data-amp=\"1.35\" width=\"1660\" height=\"660\" style=\"width:100%;flex:1;min-height:0;display:block;image-rendering:pixelated;border:8px solid #0D0D0D;\"><\u002Fcanvas>\n      <div style=\"display:flex;gap:48px;flex-wrap:wrap;align-items:baseline;\">\n        <span style=\"font-size:28px;color:#4A4A46;\">ГРУНТ <span style=\"color:#0D0D0D;\">{{ groundVal }}<\u002Fspan><\u002Fspan>\n        <span style=\"font-size:28px;color:#4A4A46;\">ВЕТЕР <span style=\"color:#0D0D0D;\">{{ windVal }}<\u002Fspan><\u002Fspan>\n        <span style=\"font-size:28px;color:#4A4A46;\">ГРАВИТАЦИЯ <span style=\"color:#0D0D0D;\">{{ gravVal }}<\u002Fspan><\u002Fspan>\n        <span style=\"font-family:'PixelSans',monospace;font-size:32px;color:#F0501E;\">агент этих чисел не видит<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"03 Постановка\" data-screen-label=\"03\" data-speaker-notes=\"Постановка в общем виде: политика, час обучения на CPU, оценка на закрытых биомах, считаем метры.\" style=\"width:1920px;height:1080px;background:#E8E7E1;font-family:'JetBrains Mono',monospace;padding:24px;box-sizing:border-box;\">\n  <div style=\"width:100%;height:100%;border:8px solid #0D0D0D;background:#FEFEFE;box-sizing:border-box;display:flex;flex-direction:column;\">\n    <div style=\"height:92px;background:#F0501E;border-bottom:8px solid #0D0D0D;display:flex;align-items:center;padding:0 28px;box-sizing:border-box;flex-shrink:0;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:46px;color:#0D0D0D;\">ГРАДИЕНТ<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 100px;box-sizing:border-box;gap:46px;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:34px;letter-spacing:3px;color:#F0501E;\">ПОСТАНОВКА ЗАДАЧИ В ОБЩЕМ ВИДЕ<\u002Fspan>\n      <p style=\"margin:0;font-family:'PixelSans',monospace;font-size:88px;line-height:1.14;color:#0D0D0D;max-width:1660px;\">Обучить политику, которая за пять минут проедет как можно дальше по мирам, <span style=\"color:#F0501E;\">которых она не видела при обучении<\u002Fspan><\u002Fp>\n      <div style=\"display:flex;gap:28px;\">\n        <div style=\"flex:1;border:7px solid #0D0D0D;box-sizing:border-box;\">\n          <div style=\"background:#F0501E;border-bottom:7px solid #0D0D0D;padding:12px 22px;\"><span style=\"font-family:'PixelSans',monospace;font-size:30px;color:#0D0D0D;\">ОБУЧЕНИЕ<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:24px;\"><div style=\"font-family:'PixelSans',monospace;font-size:52px;color:#0D0D0D;\">час на CPU<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;border:7px solid #0D0D0D;box-sizing:border-box;\">\n          <div style=\"background:#4FA3E3;border-bottom:7px solid #0D0D0D;padding:12px 22px;\"><span style=\"font-family:'PixelSans',monospace;font-size:30px;color:#0D0D0D;\">ОЦЕНКА<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:24px;\"><div style=\"font-family:'PixelSans',monospace;font-size:52px;color:#0D0D0D;\">закрытые биомы<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;border:7px solid #0D0D0D;background:#0D0D0D;box-sizing:border-box;\">\n          <div style=\"background:#FEFEFE;border-bottom:7px solid #0D0D0D;padding:12px 22px;\"><span style=\"font-family:'PixelSans',monospace;font-size:30px;color:#0D0D0D;\">СЧИТАЕМ<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:24px;\"><div style=\"font-family:'PixelSans',monospace;font-size:52px;color:#F0501E;\">метры<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"04 Усложнение\" data-screen-label=\"04\" data-speaker-notes=\"Перечислить механизмы усложнения. Параметры ровера не разбираем. Энергия восполняемый, но расходуемый ресурс.\" style=\"width:1920px;height:1080px;background:#E8E7E1;font-family:'JetBrains Mono',monospace;padding:24px;box-sizing:border-box;\">\n  <div style=\"width:100%;height:100%;border:8px solid #0D0D0D;background:#FEFEFE;box-sizing:border-box;display:flex;flex-direction:column;\">\n    <div style=\"height:92px;background:#F0501E;border-bottom:8px solid #0D0D0D;display:flex;align-items:center;padding:0 28px;box-sizing:border-box;flex-shrink:0;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:46px;color:#0D0D0D;\">ГРАДИЕНТ<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;padding:52px 100px 56px 100px;box-sizing:border-box;gap:32px;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:92px;color:#0D0D0D;\">МЕХАНИЗМЫ УСЛОЖНЕНИЯ<\u002Fspan>\n      <div style=\"flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-content:start;\">\n        <div style=\"border:7px solid #0D0D0D;padding:20px 24px;font-family:'PixelSans',monospace;font-size:34px;color:#0D0D0D;\">рельеф на максимальной сложности<\u002Fdiv>\n        <div style=\"border:7px solid #0D0D0D;padding:20px 24px;font-family:'PixelSans',monospace;font-size:34px;color:#0D0D0D;\">лёд, песок, сыпучий грунт<\u002Fdiv>\n        <div style=\"border:7px solid #0D0D0D;padding:20px 24px;font-family:'PixelSans',monospace;font-size:34px;color:#0D0D0D;\">вязкая жидкость и погружение<\u002Fdiv>\n        <div style=\"border:7px solid #0D0D0D;padding:20px 24px;font-family:'PixelSans',monospace;font-size:34px;color:#0D0D0D;\">ветер и разная гравитация<\u002Fdiv>\n        <div style=\"border:7px solid #0D0D0D;padding:20px 24px;font-family:'PixelSans',monospace;font-size:34px;color:#0D0D0D;\">холодный старт и перегрев<\u002Fdiv>\n        <div style=\"border:7px solid #0D0D0D;padding:20px 24px;font-family:'PixelSans',monospace;font-size:34px;color:#0D0D0D;\">глохнущий двигатель и передачи<\u002Fdiv>\n        <div style=\"border:7px solid #0D0D0D;padding:20px 24px;font-family:'PixelSans',monospace;font-size:34px;color:#0D0D0D;\">лидар видит на три метра<\u002Fdiv>\n        <div style=\"border:7px solid #0D0D0D;padding:20px 24px;font-family:'PixelSans',monospace;font-size:34px;color:#0D0D0D;\">урон от жёстких контактов<\u002Fdiv>\n        <div style=\"border:7px solid #0D0D0D;padding:20px 24px;font-family:'PixelSans',monospace;font-size:34px;color:#0D0D0D;\">ямы и возврат на твёрдую землю<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F0501E;border:7px solid #0D0D0D;padding:22px 28px;display:flex;align-items:baseline;gap:22px;flex-wrap:wrap;\">\n        <span style=\"font-family:'PixelSans',monospace;font-size:46px;color:#0D0D0D;\">ЭНЕРГИЯ<\u002Fspan>\n        <span style=\"font-family:'PixelSans',monospace;font-size:38px;color:#0D0D0D;\">восполняемый, но расходуемый ресурс<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"05 Сенсоры\" data-screen-label=\"05\" data-speaker-notes=\"Параметров много, картинки нет. Ориентироваться можно только на сенсоры ровера.\" style=\"width:1920px;height:1080px;background:#E8E7E1;font-family:'JetBrains Mono',monospace;padding:24px;box-sizing:border-box;\">\n  <div style=\"width:100%;height:100%;border:8px solid #0D0D0D;background:#FEFEFE;box-sizing:border-box;display:flex;flex-direction:column;\">\n    <div style=\"height:92px;background:#F0501E;border-bottom:8px solid #0D0D0D;display:flex;align-items:center;padding:0 28px;box-sizing:border-box;flex-shrink:0;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:46px;color:#0D0D0D;\">ГРАДИЕНТ<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;padding:56px 100px;box-sizing:border-box;gap:52px;\">\n      <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;\">\n        <span style=\"font-family:'PixelSans',monospace;font-size:104px;line-height:1.05;color:#0D0D0D;\">КАРТИНКИ<br>НЕТ<\u002Fspan>\n        <div style=\"display:flex;align-items:baseline;gap:20px;\">\n          <span style=\"font-family:'PixelSans',monospace;font-size:120px;line-height:0.95;color:#F0501E;\">160<\u002Fspan>\n          <span style=\"font-family:'PixelSans',monospace;font-size:34px;color:#4A4A46;\">float на шаг<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-family:'PixelSans',monospace;font-size:36px;line-height:1.3;color:#0D0D0D;\">Ориентируетесь только на сенсоры ровера<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width:900px;flex-shrink:0;display:flex;flex-direction:column;gap:20px;\">\n        <div style=\"border:7px solid #0D0D0D;box-sizing:border-box;\">\n          <div style=\"background:#4FA3E3;border-bottom:7px solid #0D0D0D;padding:12px 22px;\"><span style=\"font-family:'PixelSans',monospace;font-size:30px;color:#0D0D0D;\">ЧТО ЕСТЬ В НАБЛЮДЕНИИ<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:22px 24px;display:flex;flex-wrap:wrap;gap:12px;\">\n            <span style=\"border:3px solid #0D0D0D;font-size:25px;padding:8px 14px;color:#0D0D0D;\">поза и скорости<\u002Fspan>\n            <span style=\"border:3px solid #0D0D0D;font-size:25px;padding:8px 14px;color:#0D0D0D;\">контакт колёс<\u002Fspan>\n            <span style=\"border:3px solid #0D0D0D;font-size:25px;padding:8px 14px;color:#0D0D0D;\">проскальзывание<\u002Fspan>\n            <span style=\"border:3px solid #0D0D0D;font-size:25px;padding:8px 14px;color:#0D0D0D;\">ход подвески<\u002Fspan>\n            <span style=\"border:3px solid #0D0D0D;font-size:25px;padding:8px 14px;color:#0D0D0D;\">рельеф на три метра<\u002Fspan>\n            <span style=\"border:3px solid #0D0D0D;font-size:25px;padding:8px 14px;color:#0D0D0D;\">передача и сцепление<\u002Fspan>\n            <span style=\"border:3px solid #0D0D0D;font-size:25px;padding:8px 14px;color:#0D0D0D;\">температура<\u002Fspan>\n            <span style=\"border:3px solid #0D0D0D;font-size:25px;padding:8px 14px;color:#0D0D0D;\">энергия<\u002Fspan>\n            <span style=\"border:3px solid #0D0D0D;font-size:25px;padding:8px 14px;color:#0D0D0D;\">IMU<\u002Fspan>\n            <span style=\"border:3px solid #0D0D0D;font-size:25px;padding:8px 14px;color:#0D0D0D;\">контакты корпуса<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;border:7px solid #F0501E;background:#0D0D0D;box-sizing:border-box;\">\n          <div style=\"background:#F0501E;padding:12px 22px;\"><span style=\"font-family:'PixelSans',monospace;font-size:30px;color:#0D0D0D;\">ЧЕГО НЕТ<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:22px 24px;display:flex;flex-wrap:wrap;gap:12px;\">\n            <span style=\"border:3px solid #FEFEFE;font-size:25px;padding:8px 14px;color:#FEFEFE;\">трение<\u002Fspan>\n            <span style=\"border:3px solid #FEFEFE;font-size:25px;padding:8px 14px;color:#FEFEFE;\">вязкость<\u002Fspan>\n            <span style=\"border:3px solid #FEFEFE;font-size:25px;padding:8px 14px;color:#FEFEFE;\">множитель гравитации<\u002Fspan>\n            <span style=\"border:3px solid #FEFEFE;font-size:25px;padding:8px 14px;color:#FEFEFE;\">ветер<\u002Fspan>\n            <span style=\"border:3px solid #FEFEFE;font-size:25px;padding:8px 14px;color:#FEFEFE;\">скорость зарядки<\u002Fspan>\n            <span style=\"border:3px solid #FEFEFE;font-size:25px;padding:8px 14px;color:#FEFEFE;\">карта трассы<\u002Fspan>\n            <span style=\"border:3px solid #FEFEFE;font-size:25px;padding:8px 14px;color:#FEFEFE;\">картинка мира<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"06 Три метра\" data-screen-label=\"06\" data-speaker-notes=\"Штрихованное это то, чего в наблюдении нет. Три метра впереди и ничего позади.\" style=\"width:1920px;height:1080px;background:#E8E7E1;font-family:'JetBrains Mono',monospace;padding:24px;box-sizing:border-box;\">\n  <div style=\"width:100%;height:100%;border:8px solid #0D0D0D;background:#FEFEFE;box-sizing:border-box;display:flex;flex-direction:column;\">\n    <div style=\"height:92px;background:#F0501E;border-bottom:8px solid #0D0D0D;display:flex;align-items:center;padding:0 28px;box-sizing:border-box;flex-shrink:0;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:46px;color:#0D0D0D;\">ГРАДИЕНТ<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;padding:44px 100px 52px 100px;box-sizing:border-box;gap:24px;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:92px;line-height:1;color:#0D0D0D;\">ВОТ ЧТО ВИДИТ АГЕНТ<\u002Fspan>\n      <canvas class=\"cv\" data-fov=\"1\" data-amp=\"1.15\" width=\"1660\" height=\"560\" style=\"width:100%;flex:1;min-height:0;display:block;image-rendering:pixelated;border:8px solid #0D0D0D;\"><\u002Fcanvas>\n      <div style=\"display:flex;gap:20px;\">\n        <div style=\"flex:1;background:#F0501E;border:7px solid #0D0D0D;padding:18px 22px;box-sizing:border-box;\">\n          <div style=\"font-size:24px;color:#0D0D0D;\">ГОРИЗОНТ<\u002Fdiv>\n          <div style=\"font-family:'PixelSans',monospace;font-size:44px;color:#0D0D0D;\">3 метра<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;border:7px solid #0D0D0D;padding:18px 22px;box-sizing:border-box;\">\n          <div style=\"font-size:24px;color:#4A4A46;\">ЛИДАР<\u002Fdiv>\n          <div style=\"font-family:'PixelSans',monospace;font-size:36px;color:#0D0D0D;\">платный скан<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;border:7px solid #0D0D0D;padding:18px 22px;box-sizing:border-box;\">\n          <div style=\"font-size:24px;color:#4A4A46;\">ПАМЯТЬ<\u002Fdiv>\n          <div style=\"font-family:'PixelSans',monospace;font-size:36px;color:#0D0D0D;\">только GRU<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;border:7px solid #0D0D0D;background:#0D0D0D;padding:18px 22px;box-sizing:border-box;\">\n          <div style=\"font-size:24px;color:#A0A098;\">РЕШЕНИЕ<\u002Fdiv>\n          <div style=\"font-family:'PixelSans',monospace;font-size:36px;color:#FEFEFE;\">до того, как видно<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"07 Frame skip\" data-screen-label=\"07\" data-speaker-notes=\"Про фрейм скип: 8 тиков на действие, 7.5 решений в секунду. Зачем: короче горизонт, быстрее симуляция, действие успевает дать отклик.\" style=\"width:1920px;height:1080px;background:#E8E7E1;font-family:'JetBrains Mono',monospace;padding:24px;box-sizing:border-box;\">\n  <div style=\"width:100%;height:100%;border:8px solid #0D0D0D;background:#FEFEFE;box-sizing:border-box;display:flex;flex-direction:column;\">\n    <div style=\"height:92px;background:#F0501E;border-bottom:8px solid #0D0D0D;display:flex;align-items:center;padding:0 28px;box-sizing:border-box;flex-shrink:0;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:46px;color:#0D0D0D;\">ГРАДИЕНТ<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 100px;box-sizing:border-box;gap:42px;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:100px;color:#0D0D0D;\">FRAME SKIP<\u002Fspan>\n      <div style=\"display:flex;gap:22px;\">\n        <div style=\"flex:1;border:7px solid #0D0D0D;padding:26px;box-sizing:border-box;\">\n          <div style=\"font-family:'PixelSans',monospace;font-size:82px;line-height:1;color:#0D0D0D;\">1/60<\u002Fdiv>\n          <div style=\"font-size:26px;color:#4A4A46;margin-top:12px;\">шаг физики<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;border:7px solid #0D0D0D;background:#F0501E;padding:26px;box-sizing:border-box;\">\n          <div style=\"font-family:'PixelSans',monospace;font-size:82px;line-height:1;color:#0D0D0D;\">8<\u002Fdiv>\n          <div style=\"font-size:26px;color:#0D0D0D;margin-top:12px;\">тиков держится действие<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;border:7px solid #0D0D0D;padding:26px;box-sizing:border-box;\">\n          <div style=\"font-family:'PixelSans',monospace;font-size:82px;line-height:1;color:#0D0D0D;\">7.5<\u002Fdiv>\n          <div style=\"font-size:26px;color:#4A4A46;margin-top:12px;\">решений в секунду<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;border:7px solid #0D0D0D;background:#4FA3E3;padding:26px;box-sizing:border-box;\">\n          <div style=\"font-family:'PixelSans',monospace;font-size:82px;line-height:1;color:#0D0D0D;\">31<\u002Fdiv>\n          <div style=\"font-size:26px;color:#0D0D0D;margin-top:12px;\">макрос поверх 24 битов<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:22px;\">\n        <div style=\"flex:1;border-top:7px solid #0D0D0D;padding-top:18px;font-family:'PixelSans',monospace;font-size:32px;color:#0D0D0D;\">2250 решений на эпизод вместо 18 000<\u002Fdiv>\n        <div style=\"flex:1;border-top:7px solid #0D0D0D;padding-top:18px;font-family:'PixelSans',monospace;font-size:32px;color:#0D0D0D;\">действие успевает дать отклик в физике<\u002Fdiv>\n        <div style=\"flex:1;border-top:7px solid #0D0D0D;padding-top:18px;font-family:'PixelSans',monospace;font-size:32px;color:#0D0D0D;\">короче горизонт, дешевле обучение<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"08 Штрафы\" data-screen-label=\"08\" data-speaker-notes=\"Что за что списывается. Плюс десять секунд из бюджета за переворот и за падение в яму.\" style=\"width:1920px;height:1080px;background:#E8E7E1;font-family:'JetBrains Mono',monospace;padding:24px;box-sizing:border-box;\">\n  <div style=\"width:100%;height:100%;border:8px solid #0D0D0D;background:#FEFEFE;box-sizing:border-box;display:flex;flex-direction:column;\">\n    <div style=\"height:92px;background:#F0501E;border-bottom:8px solid #0D0D0D;display:flex;align-items:center;padding:0 28px;box-sizing:border-box;flex-shrink:0;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:46px;color:#0D0D0D;\">ГРАДИЕНТ<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;padding:52px 100px 56px 100px;box-sizing:border-box;gap:30px;\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:40px;\">\n        <span style=\"font-family:'PixelSans',monospace;font-size:92px;color:#0D0D0D;\">ШТРАФЫ<\u002Fspan>\n        <span style=\"font-family:'PixelSans',monospace;font-size:32px;color:#4A4A46;\">эпизод 300 секунд, 18 000 тиков<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1;display:flex;flex-direction:column;gap:18px;\">\n        <div style=\"border:7px solid #0D0D0D;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px;\">\n          <span style=\"font-family:'PixelSans',monospace;font-size:38px;color:#0D0D0D;\">переворот<\u002Fspan>\n          <span style=\"font-family:'PixelSans',monospace;font-size:40px;color:#0D0D0D;\">5.0 в награде <span style=\"color:#F0501E;\">и 10 секунд из бюджета<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border:7px solid #0D0D0D;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px;\">\n          <span style=\"font-family:'PixelSans',monospace;font-size:38px;color:#0D0D0D;\">падение в яму<\u002Fspan>\n          <span style=\"font-family:'PixelSans',monospace;font-size:40px;color:#F0501E;\">10 секунд и возврат на твёрдую землю<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border:7px solid #0D0D0D;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px;\">\n          <span style=\"font-family:'PixelSans',monospace;font-size:38px;color:#0D0D0D;\">жёсткий контакт<\u002Fspan>\n          <span style=\"font-family:'PixelSans',monospace;font-size:40px;color:#0D0D0D;\">0.2 за единицу урона<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border:7px solid #0D0D0D;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px;\">\n          <span style=\"font-family:'PixelSans',monospace;font-size:38px;color:#0D0D0D;\">расход энергии<\u002Fspan>\n          <span style=\"font-family:'PixelSans',monospace;font-size:40px;color:#0D0D0D;\">0.01 за единицу расхода<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"border:7px solid #0D0D0D;background:#0D0D0D;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px;\">\n          <span style=\"font-family:'PixelSans',monospace;font-size:38px;color:#FEFEFE;\">прогресс по горизонтали<\u002Fspan>\n          <span style=\"font-family:'PixelSans',monospace;font-size:40px;color:#F0501E;\">плюс 1.0 за метр<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"09 Что можно\" data-screen-label=\"09\" data-speaker-notes=\"Акцент на том, что менять можно. ЛЛМ можно использовать вовсю, в любых ипостасях.\" style=\"width:1920px;height:1080px;background:#E8E7E1;font-family:'JetBrains Mono',monospace;padding:24px;box-sizing:border-box;\">\n  <div style=\"width:100%;height:100%;border:8px solid #0D0D0D;background:#FEFEFE;box-sizing:border-box;display:flex;flex-direction:column;\">\n    <div style=\"height:92px;background:#F0501E;border-bottom:8px solid #0D0D0D;display:flex;align-items:center;padding:0 28px;box-sizing:border-box;flex-shrink:0;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:46px;color:#0D0D0D;\">ГРАДИЕНТ<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;padding:48px 100px 56px 100px;box-sizing:border-box;gap:28px;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:96px;color:#0D0D0D;\">МЕНЯТЬ МОЖНО ПОЧТИ ВСЁ<\u002Fspan>\n      <div style=\"flex:1;display:flex;gap:26px;\">\n        <div style=\"flex:1.6;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-content:start;\">\n          <div style=\"background:#F0501E;border:7px solid #0D0D0D;padding:18px 22px;font-family:'PixelSans',monospace;font-size:32px;color:#0D0D0D;\">алгоритм обучения<\u002Fdiv>\n          <div style=\"background:#F0501E;border:7px solid #0D0D0D;padding:18px 22px;font-family:'PixelSans',monospace;font-size:32px;color:#0D0D0D;\">архитектура и гиперпараметры<\u002Fdiv>\n          <div style=\"background:#F0501E;border:7px solid #0D0D0D;padding:18px 22px;font-family:'PixelSans',monospace;font-size:32px;color:#0D0D0D;\">генерация трассы и сложность<\u002Fdiv>\n          <div style=\"background:#F0501E;border:7px solid #0D0D0D;padding:18px 22px;font-family:'PixelSans',monospace;font-size:32px;color:#0D0D0D;\">свои тренировочные биомы<\u002Fdiv>\n          <div style=\"background:#F0501E;border:7px solid #0D0D0D;padding:18px 22px;font-family:'PixelSans',monospace;font-size:32px;color:#0D0D0D;\">шейпинг награды в train.py<\u002Fdiv>\n          <div style=\"background:#F0501E;border:7px solid #0D0D0D;padding:18px 22px;font-family:'PixelSans',monospace;font-size:32px;color:#0D0D0D;\">движок среды под свои нужды<\u002Fdiv>\n          <div style=\"grid-column:span 2;border:7px solid #0D0D0D;background:#0D0D0D;padding:20px 24px;\">\n            <div style=\"font-family:'PixelSans',monospace;font-size:42px;color:#FEFEFE;\">ЛЛМ ВОВСЮ, В ЛЮБЫХ ИПОСТАСЯХ<\u002Fdiv>\n            <div style=\"font-family:'PixelSans',monospace;font-size:30px;line-height:1.35;color:#FEFEFE;margin-top:8px;\">кодовый агент, чтение кода среды, генерация биомов, подбор гиперпараметров, разбор логов, идеи для награды<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;border:7px solid #0D0D0D;box-sizing:border-box;display:flex;flex-direction:column;\">\n          <div style=\"background:#4FA3E3;border-bottom:7px solid #0D0D0D;padding:12px 22px;\"><span style=\"font-family:'PixelSans',monospace;font-size:30px;color:#0D0D0D;\">ФИКСИРОВАНО<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:1;padding:24px;display:flex;flex-direction:column;gap:16px;\">\n            <span style=\"font-family:'PixelSans',monospace;font-size:32px;color:#0D0D0D;\">контракт наблюдений<\u002Fspan>\n            <span style=\"font-family:'PixelSans',monospace;font-size:32px;color:#0D0D0D;\">набор и порядок действий<\u002Fspan>\n            <span style=\"font-family:'PixelSans',monospace;font-size:32px;color:#0D0D0D;\">конструкция ровера<\u002Fspan>\n            <span style=\"font-family:'PixelSans',monospace;font-size:32px;color:#0D0D0D;\">базовая физика<\u002Fspan>\n            <span style=\"font-family:'PixelSans',monospace;font-size:32px;color:#0D0D0D;\">секция reward в env.yaml<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"10 Метрика\" data-screen-label=\"10\" data-speaker-notes=\"Главное: пройти как можно дальше любым способом и любыми методами. Медиана по 48 заездам, детали на доске.\" style=\"width:1920px;height:1080px;background:#E8E7E1;font-family:'JetBrains Mono',monospace;padding:24px;box-sizing:border-box;\">\n  <div style=\"width:100%;height:100%;border:8px solid #0D0D0D;background:#FEFEFE;box-sizing:border-box;display:flex;flex-direction:column;\">\n    <div style=\"height:92px;background:#F0501E;border-bottom:8px solid #0D0D0D;display:flex;align-items:center;padding:0 28px;box-sizing:border-box;flex-shrink:0;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:46px;color:#0D0D0D;\">ГРАДИЕНТ<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 100px;box-sizing:border-box;gap:36px;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:104px;line-height:1.08;color:#0D0D0D;\">КАК МОЖНО ДАЛЬШЕ,<br><span style=\"color:#F0501E;\">ЛЮБЫМ СПОСОБОМ<\u002Fspan><\u002Fspan>\n      <span style=\"font-family:'PixelSans',monospace;font-size:38px;line-height:1.35;color:#0D0D0D;\">Любые методы, которые вы найдёте. Считаем медиану максимального пройденного расстояния<\u002Fspan>\n      <div style=\"display:flex;gap:22px;\">\n        <div style=\"flex:1;border:7px solid #0D0D0D;padding:24px 26px;box-sizing:border-box;\">\n          <div style=\"font-family:'PixelSans',monospace;font-size:68px;line-height:1;color:#F0501E;\">48<\u002Fdiv>\n          <div style=\"font-family:'PixelSans',monospace;font-size:28px;line-height:1.3;color:#0D0D0D;margin-top:10px;\">заездов, 16 сценариев на трёх сидах<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;border:7px solid #0D0D0D;padding:24px 26px;box-sizing:border-box;\">\n          <div style=\"font-family:'PixelSans',monospace;font-size:68px;line-height:1;color:#0D0D0D;\">MAX<\u002Fdiv>\n          <div style=\"font-family:'PixelSans',monospace;font-size:28px;line-height:1.3;color:#0D0D0D;margin-top:10px;\">сложность рельефа с первого метра<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;border:7px solid #0D0D0D;padding:24px 26px;box-sizing:border-box;\">\n          <div style=\"font-family:'PixelSans',monospace;font-size:68px;line-height:1;color:#0D0D0D;\">0<\u002Fdiv>\n          <div style=\"font-family:'PixelSans',monospace;font-size:28px;line-height:1.3;color:#0D0D0D;margin-top:10px;\">откат назад результат не портит<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;border:7px solid #0D0D0D;background:#0D0D0D;padding:24px 26px;box-sizing:border-box;\">\n          <div style=\"font-family:'PixelSans',monospace;font-size:68px;line-height:1;color:#F0501E;\">50%<\u002Fdiv>\n          <div style=\"font-family:'PixelSans',monospace;font-size:28px;line-height:1.3;color:#FEFEFE;margin-top:10px;\">медиана: два удачных биома не вытянут<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"11 Награда\" data-screen-label=\"11\" data-speaker-notes=\"Награда считается каждый тик в cpp/src/reward.cpp. Прогресс единственная существенная положительная часть. Энергия наказывается дважды. Награда и метрика выровнены не полностью.\" style=\"width:1920px;height:1080px;background:#E8E7E1;font-family:'JetBrains Mono',monospace;padding:24px;box-sizing:border-box;\">\n  <div style=\"width:100%;height:100%;border:8px solid #0D0D0D;background:#FEFEFE;box-sizing:border-box;display:flex;flex-direction:column;\">\n    <div style=\"height:92px;background:#F0501E;border-bottom:8px solid #0D0D0D;display:flex;align-items:center;padding:0 28px;box-sizing:border-box;flex-shrink:0;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:46px;color:#0D0D0D;\">ГРАДИЕНТ<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;padding:44px 100px 52px 100px;box-sizing:border-box;gap:24px;\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:40px;\">\n        <span style=\"font-family:'PixelSans',monospace;font-size:88px;color:#0D0D0D;\">КАК УСТРОЕНА НАГРАДА<\u002Fspan>\n        <span style=\"font-size:26px;color:#4A4A46;\">каждый тик, cpp/src/reward.cpp<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:26px;flex:1;min-height:0;\">\n        <div style=\"width:880px;flex-shrink:0;border:7px solid #0D0D0D;background:#0D0D0D;box-sizing:border-box;padding:28px 30px;display:flex;flex-direction:column;gap:8px;\">\n          <span style=\"font-size:29px;color:#FEFEFE;\">r = Δx · progress_scale<\u002Fspan>\n          <span style=\"font-size:29px;color:#FEFEFE;\">&nbsp;&nbsp;− energy_cost · energy_cost_scale<\u002Fspan>\n          <span style=\"font-size:29px;color:#FEFEFE;\">&nbsp;&nbsp;− flip_penalty <span style=\"color:#A0A098;\">(в момент переворота)<\u002Fspan><\u002Fspan>\n          <span style=\"font-size:29px;color:#4A4A46;\">&nbsp;&nbsp;− stuck_penalty (не срабатывает)<\u002Fspan>\n          <span style=\"font-size:29px;color:#4A4A46;\">&nbsp;&nbsp;+ finish_bonus (не срабатывает)<\u002Fspan>\n          <span style=\"font-size:29px;color:#FEFEFE;\">&nbsp;&nbsp;− hard_contact_penalty · damage<\u002Fspan>\n          <div style=\"height:7px;background:#F0501E;margin:16px 0;\"><\u002Fdiv>\n          <span style=\"font-size:25px;color:#A0A098;\">progress_scale 1.0 · energy_cost_scale 0.01<\u002Fspan>\n          <span style=\"font-size:25px;color:#A0A098;\">flip_penalty 5.0 · hard_contact_penalty 0.2<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;\">\n          <div style=\"border:7px solid #0D0D0D;padding:16px 22px;\">\n            <div style=\"font-family:'PixelSans',monospace;font-size:34px;color:#0D0D0D;\">ПРОГРЕСС<\u002Fdiv>\n            <div style=\"font-family:'PixelSans',monospace;font-size:28px;line-height:1.3;color:#0D0D0D;margin-top:4px;\">единственный существенный плюс, около 0.05 за тик<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:7px solid #0D0D0D;padding:16px 22px;\">\n            <div style=\"font-family:'PixelSans',monospace;font-size:34px;color:#0D0D0D;\">ЭНЕРГИЯ<\u002Fdiv>\n            <div style=\"font-family:'PixelSans',monospace;font-size:28px;line-height:1.3;color:#0D0D0D;margin-top:4px;\">наказывается дважды: в награде и в запасе<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:7px solid #0D0D0D;padding:16px 22px;\">\n            <div style=\"font-family:'PixelSans',monospace;font-size:34px;color:#0D0D0D;\">ПЕРЕВОРОТ И УРОН<\u002Fdiv>\n            <div style=\"font-family:'PixelSans',monospace;font-size:28px;line-height:1.3;color:#0D0D0D;margin-top:4px;\">штраф разовый, урон копится с контактов от 1500<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:7px solid #0D0D0D;background:#F0501E;padding:16px 22px;\">\n            <div style=\"font-family:'PixelSans',monospace;font-size:34px;color:#0D0D0D;\">НАГРАДА И МЕТРИКА РАСХОДЯТСЯ<\u002Fdiv>\n            <div style=\"font-family:'PixelSans',monospace;font-size:28px;line-height:1.3;color:#0D0D0D;margin-top:4px;\">разгон назад метрика разрешает, награда штрафует<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"12 Куда копать\" data-screen-label=\"12\" data-speaker-notes=\"Примерные направления, что менять и куда смотреть.\" style=\"width:1920px;height:1080px;background:#E8E7E1;font-family:'JetBrains Mono',monospace;padding:24px;box-sizing:border-box;\">\n  <div style=\"width:100%;height:100%;border:8px solid #0D0D0D;background:#FEFEFE;box-sizing:border-box;display:flex;flex-direction:column;\">\n    <div style=\"height:92px;background:#F0501E;border-bottom:8px solid #0D0D0D;display:flex;align-items:center;padding:0 28px;box-sizing:border-box;flex-shrink:0;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:46px;color:#0D0D0D;\">ГРАДИЕНТ<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;padding:52px 100px 56px 100px;box-sizing:border-box;gap:30px;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:96px;color:#0D0D0D;\">КУДА КОПАТЬ<\u002Fspan>\n      <div style=\"flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:20px;\">\n        <div style=\"border:7px solid #0D0D0D;box-sizing:border-box;display:flex;flex-direction:column;\">\n          <div style=\"background:#F0501E;border-bottom:7px solid #0D0D0D;padding:10px 20px;\"><span style=\"font-family:'PixelSans',monospace;font-size:28px;color:#0D0D0D;\">01 МИРЫ<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:1;padding:20px;font-family:'PixelSans',monospace;font-size:32px;line-height:1.3;color:#0D0D0D;\">свои биомы, рандомизация динамики, учебный план сложности<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:7px solid #0D0D0D;box-sizing:border-box;display:flex;flex-direction:column;\">\n color:#0D0D0D;\">train.py с рабочим PPO и стартовой политикой<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:24px;padding:18px 0;border-bottom:1px solid #C6C5BC;\"><span style=\"font-family:'PixelSans',monospace;font-size:32px;color:#F0501E;min-width:60px;\">04<\u002Fspan><span style=\"font-family:'PixelSans',monospace;font-size:40px;color:#0D0D0D;\">smoke-тест посылки перед отправкой<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:24px;padding:18px 0;border-bottom:1px solid #C6C5BC;\"><span style=\"font-family:'PixelSans',monospace;font-size:32px;color:#F0501E;min-width:60px;\">05<\u002Fspan><span style=\"font-family:'PixelSans',monospace;font-size:40px;color:#0D0D0D;\">формат ONNX с семью входами и описанным контрактом<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:24px;padding:18px 0;background:#0D0D0D;padding-left:20px;\"><span style=\"font-family:'PixelSans',monospace;font-size:32px;color:#F0501E;min-width:60px;\">нет<\u002Fspan><span style=\"font-family:'PixelSans',monospace;font-size:40px;color:#FEFEFE;\">тестовых биомов, в них есть явления, которых в сборке нет<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"16 Грабли\" data-screen-label=\"16\" data-speaker-notes=\"Секцию reward не трогать, шейпинг в train.py. Часть ключей env.yaml ни на что не влияет.\" style=\"width:1920px;height:1080px;background:#E8E7E1;font-family:'JetBrains Mono',monospace;padding:24px;box-sizing:border-box;\">\n  <div style=\"width:100%;height:100%;border:8px solid #0D0D0D;background:#FEFEFE;box-sizing:border-box;display:flex;flex-direction:column;\">\n    <div style=\"height:92px;background:#F0501E;border-bottom:8px solid #0D0D0D;display:flex;align-items:center;padding:0 28px;box-sizing:border-box;flex-shrink:0;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:46px;color:#0D0D0D;\">ГРАДИЕНТ<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 100px;box-sizing:border-box;gap:34px;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:96px;color:#0D0D0D;\">ГРАБЛИ<\u002Fspan>\n      <div style=\"display:flex;gap:28px;\">\n        <div style=\"flex:1;border:7px solid #0D0D0D;background:#0D0D0D;box-sizing:border-box;\">\n          <div style=\"background:#F0501E;padding:12px 22px;\"><span style=\"font-family:'PixelSans',monospace;font-size:30px;color:#0D0D0D;\">СЕКЦИЯ REWARD<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:28px;display:flex;flex-direction:column;gap:16px;\">\n            <span style=\"font-family:'PixelSans',monospace;font-size:52px;line-height:1.1;color:#FEFEFE;\">в env.yaml не трогать<\u002Fspan>\n            <span style=\"font-family:'PixelSans',monospace;font-size:32px;line-height:1.3;color:#FEFEFE;\">награда входит в наблюдение, на оценке считается по референсной секции<\u002Fspan>\n            <span style=\"font-family:'PixelSans',monospace;font-size:32px;color:#4FA3E3;\">шейпинг делайте в train.py<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;border:7px solid #0D0D0D;box-sizing:border-box;\">\n          <div style=\"background:#4FA3E3;border-bottom:7px solid #0D0D0D;padding:12px 22px;\"><span style=\"font-family:'PixelSans',monospace;font-size:30px;color:#0D0D0D;\">МЁРТВЫЕ КЛЮЧИ<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:28px;display:flex;flex-direction:column;gap:12px;\">\n            <span style=\"font-size:28px;color:#0D0D0D;\">finish_x<\u002Fspan>\n            <span style=\"font-size:28px;color:#0D0D0D;\">finish_bonus<\u002Fspan>\n            <span style=\"font-size:28px;color:#0D0D0D;\">stuck_steps<\u002Fspan>\n            <span style=\"font-size:28px;color:#0D0D0D;\">stuck_penalty<\u002Fspan>\n            <span style=\"font-size:28px;color:#0D0D0D;\">episodes_per_trial<\u002Fspan>\n            <span style=\"font-family:'PixelSans',monospace;font-size:30px;line-height:1.3;color:#4A4A46;\">флаги захардкожены, крутить их бесполезно<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"17 Финал\" data-screen-label=\"17\" data-speaker-notes=\"Среда сложная, бюджет маленький, тест закрытый. Выигрывает тот, кто уедет дальше. Вопросы.\" style=\"width:1920px;height:1080px;background:#E8E7E1;font-family:'JetBrains Mono',monospace;padding:24px;box-sizing:border-box;\">\n  <div style=\"width:100%;height:100%;border:8px solid #0D0D0D;background:#FEFEFE;box-sizing:border-box;display:flex;flex-direction:column;\">\n    <div style=\"height:92px;background:#F0501E;border-bottom:8px solid #0D0D0D;display:flex;align-items:center;padding:0 28px;box-sizing:border-box;flex-shrink:0;\">\n      <span style=\"font-family:'PixelSans',monospace;font-size:46px;color:#0D0D0D;\">ГРАДИЕНТ<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;box-sizing:border-box;\">\n      <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 80px;box-sizing:border-box;gap:30px;\">\n        <span style=\"font-family:'PixelSans',monospace;font-size:104px;line-height:1.08;color:#0D0D0D;\">СРЕДА СЛОЖНАЯ.<br>БЮДЖЕТ МАЛЫЙ.<br>ТЕСТ <span style=\"color:#F0501E;\">ЗАКРЫТЫЙ.<\u002Fspan><\u002Fspan>\n        <span style=\"font-family:'PixelSans',monospace;font-size:40px;color:#0D0D0D;\">Выигрывает тот, кто уедет дальше. Вопросы?<\u002Fspan>\n      <\u002Fdiv>\n      <canvas class=\"cv\" data-mode=\"rocket\" width=\"700\" height=\"880\" style=\"width:700px;height:100%;display:block;image-rendering:pixelated;border-left:8px solid #0D0D0D;flex-shrink:0;\"><\u002Fcanvas>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;animate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;simSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.25,&quot;max&quot;:2.5,&quot;step&quot;:0.25,&quot;tsType&quot;:&quot;number&quot;},&quot;worldSwitchSec&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:7,&quot;min&quot;:3,&quot;max&quot;:20,&quot;step&quot;:1,&quot;unit&quot;:&quot;с&quot;,&quot;tsType&quot;:&quot;number&quot;}}\">\nclass Component extends DCLogic {\n  worlds = [\n    { name: \"A\", ground: \"ЛЁД\", wind: \"12 м/с\", grav: \"0.38g\", rough: 1.0, windDir: 1, seed: 1.3, crust: \"#4FA3E3\" },\n    { name: \"B\", ground: \"ПЕСОК\", wind: \"3 м/с\", grav: \"1.00g\", rough: 0.55, windDir: -1, seed: 4.1, crust: \"#F0501E\" },\n    { name: \"C\", ground: \"КАМЕНЬ\", wind: \"25 м/с\", grav: \"0.16g\", rough: 1.7, windDir: 1, seed: 7.7, crust: \"#FEFEFE\" }\n  ];\n  state = { w: 0, attempt: 1 };\n\n  constructor(props) {\n    super(props);\n    this.scroll = 0;\n    this.last = 0;\n  }\n\n  componentDidMount() { this.ensureLoop(); }\n  componentWillUnmount() { clearInterval(this.timer); }\n\n  ensureLoop() {\n    if (this.timer) return;\n    if (!this.dust) this.dust = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), s: 0.3 + Math.random() }));\n    this.switchAt = Date.now() + (this.props.worldSwitchSec ?? 7) * 1000;\n    this.timer = setInterval(() => { try { this.tick(Date.now()); } catch (e) { console.error(e); } }, 33);\n  }\n\n  tick = (now) => {\n    const dt = this.last ? Math.min(0.05, (now - this.last) / 1000) : 0.016;\n    this.last = now;\n    const speed = this.props.simSpeed ?? 1;\n    if (this.props.animate !== false) this.scroll += dt * 150 * speed;\n    if (now > this.switchAt) {\n      this.switchAt = now + (this.props.worldSwitchSec ?? 7) * 1000;\n      this.setState(s => ({ w: (s.w + 1) % this.worlds.length, attempt: s.attempt + 1 }));\n    }\n    const w = this.worlds[this.state.w];\n    for (const cv of document.querySelectorAll(\"canvas.cv\")) {\n      if (cv.dataset.mode === \"rocket\") this.drawRocket(cv);\n      else this.draw(cv, w, parseFloat(cv.dataset.amp) || 1);\n    }\n  };\n\n  terrain(x, w, base, amp) {\n    const k = x / 210;\n    return base + amp * w.rough * (Math.sin(k + w.seed) * 0.55 + Math.sin(k * 2.3 + w.seed * 2) * 0.28 + Math.sin(k * 5.1) * 0.12);\n  }\n\n  drawRocket(cv) {\n    const ctx = cv.getContext(\"2d\");\n    const W = cv.width, H = cv.height, px = 8;\n    ctx.fillStyle = \"#0D0D0D\";\n    ctx.fillRect(0, 0, W, H);\n\n    const cycle = 4200;\n    const t = (this.scroll * 4) % cycle / cycle;\n    const camY = t * H * 3.2;\n\n    ctx.fillStyle = \"#26251E\";\n    for (let x = 0; x < W; x += 40) for (let y = 0; y < H; y += 40) {\n      const sy = (y + camY * 0.25) % H;\n      ctx.fillRect(x, sy, 3, 3);\n    }\n\n    const slopeAt = (worldY) => {\n      const k = worldY / 340;\n      return W * 0.62 - worldY * 0.055 + Math.sin(k) * 34 + Math.sin(k * 2.7) * 16;\n    };\n\n    for (let sy = 0; sy < H; sy += px) {\n      const worldY = camY + (H - sy);\n      const edge = slopeAt(worldY);\n      ctx.fillStyle = \"#4A4A46\";\n      ctx.fillRect(edge, sy, W - edge, px);\n      ctx.fillStyle = \"#6E6C64\";\n      ctx.fillRect(edge + px * 3, sy, W - edge - px * 3, px);\n      ctx.fillStyle = \"#F0501E\";\n      ctx.fillRect(edge, sy, px * 3, px);\n    }\n\n    const rx = Math.round(slopeAt(camY + H * 0.42) - 96);\n    const ry = Math.round(H * 0.58);\n    const jitter = Math.sin(this.scroll * 0.9) * 6;\n\n    ctx.save();\n    ctx.translate(rx + jitter, ry);\n    ctx.scale(2.1, 2.1);\n    ctx.rotate(-0.12);\n    const flame = 10 + Math.abs(Math.sin(this.scroll * 1.7)) * 16;\n    ctx.fillStyle = \"#F0501E\";\n    ctx.fillRect(-8, 8, 16, flame);\n    ctx.fillStyle = \"#FFB03A\";\n    ctx.fillRect(-4, 8, 8, flame * 0.62);\n    ctx.fillStyle = \"#FEFEFE\";\n    ctx.fillRect(-16, -14, 32, 12);\n    ctx.fillStyle = \"#F0501E\";\n    ctx.fillRect(-11, -11, 10, 6);\n    ctx.fillStyle = \"#FEFEFE\";\n    ctx.fillRect(8, -26, 4, 12);\n    ctx.fillRect(11, -30, 6, 6);\n    ctx.fillStyle = \"#4A4A46\";\n    ctx.fillRect(-13, -2, 26, 4);\n    ctx.fillStyle = \"#FEFEFE\";\n    ctx.fillRect(-14, 2, 9, 9);\n    ctx.fillRect(5, 2, 9, 9);\n    ctx.restore();\n\n    ctx.fillStyle = \"#A0A098\";\n    ctx.font = \"24px monospace\";\n    ctx.fillText(\"ВЫСОТА \" + Math.round(camY / 10) + \" М\", 28, 44);\n  }\n\n  draw(cv, w, ampScale) {\n    if (!cv) return;\n    const ctx = cv.getContext(\"2d\");\n    const W = cv.width, H = cv.height, px = 6;\n    ctx.fillStyle = \"#0D0D0D\";\n    ctx.fillRect(0, 0, W, H);\n    ctx.fillStyle = \"#26251E\";\n    for (let x = 0; x < W; x += 24) for (let y = 0; y < H; y += 24) ctx.fillRect(x, y, 2, 2);\n\n    const base = H * 0.34, amp = H * 0.13 * ampScale;\n    const s = this.scroll;\n    for (let sx = 0; sx < W; sx += px) {\n      const h = this.terrain(sx + s, w, base, amp);\n      ctx.fillStyle = \"#2E2C22\";\n      ctx.fillRect(sx, H - h, px, h);\n      ctx.fillStyle = w.crust;\n      ctx.fillRect(sx, H - h, px, px);\n    }\n\n    ctx.fillStyle = w.crust;\n    for (const d of this.dust) {\n      const dx = ((d.x * W - s * d.s * w.windDir * 0.5) % W + W) % W;\n      ctx.globalAlpha = 0.3;\n      ctx.fillRect(Math.floor(dx / 4) * 4, Math.floor((d.y * H * 0.55) / 4) * 4, 4, 4);\n    }\n    ctx.globalAlpha = 1;\n\n    const rx = Math.round(W * 0.32);\n    const hL = this.terrain(rx - 26 + s, w, base, amp);\n    const hR = this.terrain(rx + 26 + s, w, base, amp);\n    const cy = H - (hL + hR) / 2;\n    const ang = Math.atan2(hL - hR, 52);\n    const sc = Math.max(1, Math.min(2.2, H / 300));\n\n    if (cv.dataset.fov) {\n      const near = rx - 90, far = rx + 210;\n      ctx.save();\n      ctx.beginPath(); ctx.rect(0, 0, near, H); ctx.rect(far, 0, W - far, H); ctx.clip();\n      ctx.fillStyle = \"rgba(8,8,8,0.93)\"; ctx.fillRect(0, 0, W, H);\n      ctx.strokeStyle = \"#302C24\"; ctx.lineWidth = 2;\n      for (let d = -H; d < W + H; d += 20) { ctx.beginPath(); ctx.moveTo(d, 0); ctx.lineTo(d + H, H); ctx.stroke(); }\n      ctx.restore();\n      ctx.strokeStyle = \"#4FA3E3\"; ctx.lineWidth = 4; ctx.setLineDash([12, 9]);\n      ctx.beginPath(); ctx.moveTo(near, 0); ctx.lineTo(near, H); ctx.moveTo(far, 0); ctx.lineTo(far, H); ctx.stroke();\n      ctx.setLineDash([]);\n      ctx.fillStyle = \"#4FA3E3\"; ctx.font = \"26px monospace\";\n      ctx.fillText(\"3 М, ГРАНИЦА НАБЛЮДЕНИЯ\", far + 26, 46);\n      ctx.fillStyle = \"#A0A098\"; ctx.font = \"30px monospace\";\n      ctx.fillText(\"? ? ? ? ?\", far + 26, 96);\n      ctx.fillText(\"? ? ?\", 34, 46);\n      ctx.font = \"24px monospace\";\n      ctx.fillText(\"НЕ ВИДНО И НЕ ЗАПОМНЕНО\", 34, 90);\n    }\n\n    ctx.save();\n    ctx.translate(rx, cy);\n    ctx.rotate(ang);\n    ctx.scale(sc, sc);\n    ctx.fillStyle = \"#FEFEFE\";\n    ctx.fillRect(-24, -26, 48, 16);\n    ctx.fillStyle = \"#F0501E\";\n    ctx.fillRect(-16, -22, 14, 8);\n    ctx.fillStyle = \"#FEFEFE\";\n    ctx.fillRect(14, -40, 4, 14);\n    ctx.fillRect(18, -44, 6, 6);\n    ctx.fillStyle = \"#4A4A46\";\n    ctx.fillRect(-20, -10, 40, 4);\n    ctx.fillStyle = \"#FEFEFE\";\n    ctx.fillRect(-20, -6, 12, 12);\n    ctx.fillRect(8, -6, 12, 12);\n    ctx.fillStyle = \"#0D0D0D\";\n    ctx.fillRect(-16, -2, 4, 4);\n    ctx.fillRect(12, -2, 4, 4);\n    ctx.restore();\n  }\n\n  renderVals() {\n    this.ensureLoop();\n    const w = this.worlds[this.state.w];\n    return { worldName: w.name, groundVal: w.ground, windVal: w.wind, gravVal: w.grav, attempt: this.state.attempt };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
